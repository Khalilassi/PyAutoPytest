name: News Bot Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'gold_news_bot/**'
      - '.github/workflows/news-bot*.yml'
  pull_request:
    paths:
      - 'gold_news_bot/**'
      - '.github/workflows/news-bot*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gold_news_bot/requirements.txt pytest

      - name: Run tests
        run: pytest gold_news_bot/tests -q
