name: News Bot

on:
  schedule:
    # كل 15 دقيقة (كرون GitHub best-effort، ممكن يتأخر شوية في أوقات الزحمة)
    - cron: '*/15 * * * *'
    # الملخص اليومي: 11:00 صباحًا بتوقيت الرياض = 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'اطبع في اللوج من غير ما تبعت على تيليجرام'
        type: boolean
        default: false
      digest:
        description: 'ابعت ملخص الـ24 ساعة الجاية بدل تنبيهات الأخبار'
        type: boolean
        default: false

permissions:
  contents: read

# منع تشغيلين في نفس الوقت عشان ملف الحالة مايتلغبطش
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gold_news_bot/requirements.txt

      # الحالة بتتخزن في الكاش عشان البوت يفتكر إيه اللي اتبعت قبل كده
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: news-bot-state-${{ github.run_id }}
          restore-keys: |
            news-bot-state-

      - name: Run bot
        if: github.event.schedule != '0 8 * * *' && !inputs.digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: state/seen.json
          MAX_AGE_HOURS: '6'
          MAX_ITEMS_PER_RUN: '10'
        run: |
          python gold_news_bot/bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # تنبيهات التقويم الاقتصادي (قبل الخبر بنص ساعة تقريبًا).
      # always() عشان لو بوت الأخبار وقع، التنبيهات تفضل شغالة.
      - name: Run calendar bot
        if: always() && github.event.schedule != '0 8 * * *' && !inputs.digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALENDAR_STATE_FILE: state/calendar.json
        run: |
          python gold_news_bot/calendar_bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # كروت الحالة الفنية كصور (كل 15 دقيقة)
      - name: Run signals bot
        if: always() && github.event.schedule != '0 8 * * *' && !inputs.digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIGNALS_STATE_FILE: state/signals.json
          CARD_DIR: cards
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python gold_news_bot/signals_bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # الملخص اليومي: بيشتغل في تشغيلة الـ 08:00 UTC بس (11:00 الرياض)
      - name: Run daily digest
        if: always() && (github.event.schedule == '0 8 * * *' || inputs.digest)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALENDAR_STATE_FILE: state/calendar.json
        run: |
          python gold_news_bot/calendar_bot.py --digest ${{ inputs.dry_run && '--dry-run' || '' }}

      # مفاتيح الكاش immutable، فبنحفظ بمفتاح جديد كل run
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: news-bot-state-${{ github.run_id }}
