name: News Bot

on:
  schedule:
    # كل 15 دقيقة (كرون GitHub best-effort، ممكن يتأخر شوية في أوقات الزحمة)
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'اطبع الأخبار في اللوج من غير ما تبعتها على تيليجرام'
        type: boolean
        default: false

permissions:
  contents: read

# منع تشغيلين في نفس الوقت عشان ملف الحالة مايتلغبطش
concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gold_news_bot/requirements.txt

      # الحالة بتتخزن في الكاش عشان البوت يفتكر إيه اللي اتبعت قبل كده
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: news-bot-state-${{ github.run_id }}
          restore-keys: |
            news-bot-state-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: state/seen.json
          MAX_AGE_HOURS: '6'
          MAX_ITEMS_PER_RUN: '10'
        run: |
          python gold_news_bot/bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # تنبيهات التقويم الاقتصادي (قبل الخبر بنص ساعة تقريبًا).
      # always() عشان لو بوت الأخبار وقع، التنبيهات تفضل شغالة.
      - name: Run calendar bot
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALENDAR_STATE_FILE: state/calendar.json
        run: |
          python gold_news_bot/calendar_bot.py ${{ inputs.dry_run && '--dry-run' || '' }}

      # مفاتيح الكاش immutable، فبنحفظ بمفتاح جديد كل run
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: news-bot-state-${{ github.run_id }}
